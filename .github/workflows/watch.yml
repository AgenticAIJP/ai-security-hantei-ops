# watcher: Room の新着を 15 分ごとに確認し、登録済みの投稿者の投稿だけをきっかけに Agent を起こす。
# LLM は使わない。混雑する :00 と :30 を避ける。
name: watch

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}

# 前の実行が終わる前に次を始めない（二重起動を防ぐ）
concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write   # state/watcher.json を commit するため（このリポジトリだけ）

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions はコミット ID で固定する（タグの付け替えによる差し替えを防ぐ）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 記憶リポジトリは公開なので、読むだけならトークンは要らない。
      # 改ざん検知で「確かめた commit」と比べるため、履歴をすべて取る。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AgenticAIJP/ai-security-hantei
          path: brain
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: watcher
        run: node scripts/watcher.mjs --brain brain
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAIN_REPO_PAT: ${{ secrets.BRAIN_REPO_PAT }}
          FIRE_URL_NENE: ${{ secrets.FIRE_URL_NENE }}
          FIRE_TOKEN_NENE: ${{ secrets.FIRE_TOKEN_NENE }}
          FIRE_URL_BASELINE: ${{ secrets.FIRE_URL_BASELINE }}
          FIRE_TOKEN_BASELINE: ${{ secrets.FIRE_TOKEN_BASELINE }}
          # 武将を routine に切り替えたときだけ設定する（未設定なら空になり、使われない）
          FIRE_URL_NOBUNAGA: ${{ secrets.FIRE_URL_NOBUNAGA }}
          FIRE_TOKEN_NOBUNAGA: ${{ secrets.FIRE_TOKEN_NOBUNAGA }}
          FIRE_URL_SHINGEN: ${{ secrets.FIRE_URL_SHINGEN }}
          FIRE_TOKEN_SHINGEN: ${{ secrets.FIRE_TOKEN_SHINGEN }}
          FIRE_URL_MITSUHIDE: ${{ secrets.FIRE_URL_MITSUHIDE }}
          FIRE_TOKEN_MITSUHIDE: ${{ secrets.FIRE_TOKEN_MITSUHIDE }}
          FIRE_URL_KENSHIN: ${{ secrets.FIRE_URL_KENSHIN }}
          FIRE_TOKEN_KENSHIN: ${{ secrets.FIRE_TOKEN_KENSHIN }}
          FIRE_URL_HIDEYOSHI: ${{ secrets.FIRE_URL_HIDEYOSHI }}
          FIRE_TOKEN_HIDEYOSHI: ${{ secrets.FIRE_TOKEN_HIDEYOSHI }}
          FIRE_URL_CHACHA: ${{ secrets.FIRE_URL_CHACHA }}
          FIRE_TOKEN_CHACHA: ${{ secrets.FIRE_TOKEN_CHACHA }}
          FIRE_URL_IEYASU: ${{ secrets.FIRE_URL_IEYASU }}
          FIRE_TOKEN_IEYASU: ${{ secrets.FIRE_TOKEN_IEYASU }}
          FIRE_URL_KANBEI: ${{ secrets.FIRE_URL_KANBEI }}
          FIRE_TOKEN_KANBEI: ${{ secrets.FIRE_TOKEN_KANBEI }}

      - name: commit watcher state
        run: |
          git config user.name "ais-watcher"
          git config user.email "ais-watcher@users.noreply.github.com"
          git add state/watcher.json
          if ! git diff --cached --quiet; then
            git commit -q -m "watcher: state"
            git push -q
          fi
