# watcher: Room の新着を 30 分ごとに確認し、登録済みの投稿者の投稿だけをきっかけに Agent を起こす。
# LLM は使わない。混雑する :00 と :30 を避ける。
name: watch

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

# 前の実行が終わる前に次を始めない（二重起動を防ぐ）
concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write   # state/watcher.json を commit するため（このリポジトリだけ）

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions はコミット ID で固定する（タグの付け替えによる差し替えを防ぐ）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 記憶リポジトリは公開なので、読むだけならトークンは要らない。
      # 改ざん検知で「確かめた commit」と比べるため、履歴をすべて取る。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AgenticAIJP/ai-security-hantei
          path: brain
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: watcher
        run: node scripts/watcher.mjs --brain brain
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAIN_REPO_PAT: ${{ secrets.BRAIN_REPO_PAT }}
          # routines で動くのは素の Claude だけ（投稿しないのでキーがない）
          FIRE_URL_BASELINE: ${{ secrets.FIRE_URL_BASELINE }}
          FIRE_TOKEN_BASELINE: ${{ secrets.FIRE_TOKEN_BASELINE }}

      - name: commit watcher state
        run: |
          git config user.name "ais-watcher"
          git config user.email "ais-watcher@users.noreply.github.com"
          git add state/watcher.json
          if ! git diff --cached --quiet; then
            git commit -q -m "watcher: state"
            # iQi の push と重なっても状態を失わないように（失うと同じ人を二重に起こす）
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          fi
